name: Monthly Student Report

on:
  schedule:
    - cron: '0 18 1 * *' # On the 1st of every month at 6:00 PM UTC
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Send Monthly Email
        working-directory: ./backend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npx tsx src/scripts/send-monthly-email.ts
